<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5c8f" />
    <link rel="manifest" href="/manifest.json" />

    <title>Stephen Dorn</title>
    <meta
      name="description"
      content="Stephen Dorn is a PhD student in Computational Medicine at UCLA, working on statistical genetics: polygenic risk prediction, the impact of genomic variation on function, and the genetics of neurological disease."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stephen Dorn" />
    <meta
      property="og:description"
      content="PhD student in Computational Medicine at UCLA. Statistical genetics, polygenic risk prediction, and neurological disease."
    />
    <meta property="og:url" content="https://stephendorn.com" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
